<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pokedex</title>
</head>
<body>
    <div class="header">
        <h1>Your Digital Pokedex</h1>
    </div>
    <div class="pokedex" id="pokedex">
        <div class="pokedexHeader">
            <div class="pokedexLeft-header">
                <div class="camera"></div>
                <div class="smallCircle redCircle"></div>
                <div class="smallCircle yellowCircle"></div>
                <div class="smallCircle greenCircle"></div>
            </div>
            <div class="pokedexRight-header">
            </div>
        </div>
        <div class="pokedexMain">
            <div class="pokedexLeft pokedexHalf">   
                <div class="grayRectangle grayLeft">
                    <div class="screen">
                        <div class="card">
                            <div class="cardLeft">
                                <h3 class="name">Ditto</h3>
                                <div class="generalInfo">
                                    <p>Species: Ditto</p>
                                    <p>Height: 3</p>
                                    <p>Weight: 40</p>
                                </div>
                                <div class="stats">
                                    <p>HP: 48</p>
                                    <p>Attack: 48</p>
                                    <p>Defense: 48</p>
                                    <p>Special Attack: 48</p>
                                    <p>Special Defense: 48</p>
                                    <p>Speed: 48</p>
                                </div>
                            </div>
                            <div class="cardRight">
                                <p>ID: 132</p>
                                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/132.png" alt="default sprite of Ditto" width="auto" >
                                <div class="abilities">
                                    <p>Abilities</p>
                                    <p>1- Limber</p>
                                    <p>2- Impostor</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pokedexCenter">
                <div class="topLines">
                    <div class="line line1"></div>
                    <div class="line line2"></div>
                </div>
                <div class="bottomLines">
                    <div class="line line3"></div>
                    <div class="line line4"></div>
                </div>
            </div>
            <div class="pokedexRight pokedexHalf">
                <div class="container">
                    <div class="searchBar">
                        <input type="text" class="search" placeholder="Search">
                    </div>
                    <div class="grayRectangle grayRight">
                        <div class="screen">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
