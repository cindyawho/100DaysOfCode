<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pokedex</title>
</head>
<body>
    <div class="header">
        <h1>Your Digital Pokedex</h1>
    </div>
    <div class="pokedex" id="pokedex">
        <div class="pokedexHeader">
            <div class="pokedexLeft-header">
                <div class="camera"></div>
                <div class="smallCircle redCircle"></div>
                <div class="smallCircle yellowCircle"></div>
                <div class="smallCircle greenCircle"></div>
            </div>
            <div class="pokedexRight-header">
            </div>
        </div>
        <div class="pokedexMain">
            <div class="pokedexLeft pokedexHalf">   
                <div class="grayRectangle grayLeft">
                    <div class="screen">
                        <div class="card">
                            <div class="cardLeft">
                                <h3 class="name" id="pokemon-Name">Ditto</h3>
                                <div class="generalInfo">
                                    <p id="pokemon-Species">Species: Ditto</p>
                                    <p id="pokemon-Height">Height: 3</p>
                                    <p id="pokemon-Weight">Weight: 40</p>
                                </div>
                                <div class="stats">
                                    <p id="pokemon-HP">HP: 48</p>
                                    <p id="pokemon-Attack">Attack: 48</p>
                                    <p id="pokemon-Defense">Defense: 48</p>
                                    <p id="pokemon-SpAttack">Special Attack: 48</p>
                                    <p id="pokemon-SpDefense">Special Defense: 48</p>
                                    <p id="pokemon-Speed">Speed: 48</p>
                                </div>
                            </div>
                            <div class="cardRight">
                                <p id="pokemon-ID">ID: 132</p>
                                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/132.png" alt="default sprite of Ditto" width="auto"  id="pokemon-Sprite">
                                <div class="abilities" id="abilitiesContainer">
                                    <p>Abilities</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pokedexCenter">
                <div class="topLines">
                    <div class="line line1"></div>
                    <div class="line line2"></div>
                </div>
                <div class="bottomLines">
                    <div class="line line3"></div>
                    <div class="line line4"></div>
                </div>
            </div>
            <div class="pokedexRight pokedexHalf">
                <div class="container">
                    <div class="grayRectangle grayRight">
                        <div class="screen">
                            <div class="searchBar">
                                <input type="text" class="search" placeholder="Search">
                                <button>Search</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
